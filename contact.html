    <style>
        /* Custom Styles */
        body {
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding-top: 80px;
        }

        header {
            background-color: #1f1f1f;
            padding: 15px;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        nav ul {
            list-style: none;
            padding: 0;
        }

        nav ul li {
            display: inline;
            margin: 0 15px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        nav ul li a.active {
            font-weight: bold;
            color: #077b3f;
        }

        .contact-section {
            margin-top: 50px;
            padding: 40px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            background-color: #1f1f1f;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(255, 255, 255, 0.1);
        }

        .contact-section h2 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #077b3f;
        }

        .contact-info {
            margin-bottom: 30px;
        }

        .contact-info a {
            display: inline-block;
            margin: 10px 15px;
            padding: 12px 20px;
            background-color: #333;
            color: #ffffff;
            text-decoration: none;
            border-radius: 50%;
            font-size: 24px;
            transition: background-color 0.3s ease;
        }

        .contact-info a:hover {
            background-color: #077b3f;
            color: #121212;
        }

        .contact-info a i {
            font-size: 20px;
        }
    </style>
</head>
